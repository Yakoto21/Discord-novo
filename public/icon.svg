<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Hexagonal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c172d"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Gradiente do Raio Azul Elétrico -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Brilho Interno do Raio -->
    <linearGradient id="boltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Efeito de Brilho Neon / Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sombra e Borda Cyan -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado do App (Squircle Discord) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Halo de Energia de Fundo -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.18" filter="blur(30px)"/>

  <!-- Raio Azul com Glow -->
  <g filter="url(#neonGlow)">
    <!-- Raio Base Externa -->
    <polygon points="280,64 150,268 250,268 210,448 372,228 266,228" fill="url(#boltGrad)"/>
    <!-- Núcleo de Luz Intensa no Centro do Raio -->
    <polygon points="274,80 166,260 252,260 218,416 352,234 264,234" fill="url(#boltCore)" opacity="0.85"/>
  </g>

  <!-- Faíscas e Partículas Quânticas de Energia -->
  <circle cx="160" cy="140" r="6" fill="#38bdf8" opacity="0.8" filter="blur(1px)"/>
  <circle cx="360" cy="120" r="8" fill="#7dd3fc" opacity="0.9" filter="blur(1px)"/>
  <circle cx="370" cy="380" r="5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="140" cy="360" r="7" fill="#60a5fa" opacity="0.8"/>
</svg>
